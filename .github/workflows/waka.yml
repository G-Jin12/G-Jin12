name: Waka Readme

on:
  schedule:
    # 매일 18:30 UTC (KST 03:30 다음날)에 실행
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    name: Update README with Dev Metrics
    runs-on: ubuntu-latest
    steps:
      
      - name: Check WakaTime API freshness
        env:
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          url = (
              "https://wakatime.com/api/v1/"
              "users/current/stats/last_7_days"
          )
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization":
                      "Bearer " + os.environ["WAKATIME_TOKEN"]
              }
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as res:
                  print("HTTP:", res.status)
                  data = json.load(res)["data"]

              for key in [
                  "is_up_to_date",
                  "is_including_today",
                  "start",
                  "end",
                  "modified_at",
                  "percent_calculated",
                  "timezone",
              ]:
                  print(key, ":", data.get(key))

              print("Languages:")
              for lang in data.get("languages", []):
                  print(lang.get("name"), lang.get("text"))

          except urllib.error.HTTPError as e:
              print("HTTP error:", e.code)
              raise SystemExit(1)
          except Exception as e:
              print("Request error:", type(e).__name__)
              raise SystemExit(1)
          PY

      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_COMMIT: "True"
          SHOW_LANGUAGE: "True"
          SHOW_AI_CODE_TIME: "False"
          SHOW_AI_CODING: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_OS: "False"
          SHOW_PROJECTS: "False"
          SHOW_TIMEZONE: "False"
          SHOW_EDITORS: "False"
          SHOW_LANGUAGE_PER_REPO: "False"
          SHOW_SHORT_INFO: "False"
          SHOW_LOC_CHART: "False"
          SHOW_LINES_OF_CODE: "False"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_TOTAL_CODE_TIME: "False"
          SHOW_UPDATED_DATE: "False"
